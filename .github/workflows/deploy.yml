# Pull requests: build check. main: build and deploy to the Cloudflare Worker "marketing-hq" (hq.bigfish.careers).
# Needs repository secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers", with the bigfish.careers zone)
# and CLOUDFLARE_ACCOUNT_ID, the same values as the website repo.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set yet: build checked, not deployed"; exit 0; fi
          npx --yes wrangler@4 deploy
